<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<fieldset>  

<label for="camara">Tipo de camara</label>
<select name="Tipo de cámara" id="camara">
        <option value="0">DSLR</option>
        <option value="1">Acción</option>
        <option value="2">Réflex (DSLR)</option>
        <option value="3">Mirrorless</option>
        <option value="4">Compacta</option>
        <option value="5">Instantánea</option>
        <option value="6">Otra</option>
</select>
    <br/>

<label for="marca">Marca</label>
<select name="Marca" id="marca">
    <option value="Canon">Canon</option>
    <option value="Nikon">Nikon</option>
    <option value="Sony">Sony</option>
    <option value="Otra">Otra</option>
</select>
    <br/>
<label for="resolucion">Resolución minima</label>   
<select name="Resolució minima">
    <option value="0">4mpx</option>
    <option value="1">8mpx</option>
    <option value="2">24mpx</option>
    <option value="3">Altres</option>
</select>

</fieldset>  

</body>
</html>
