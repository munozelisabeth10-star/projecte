<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>barras de progreso cv</title>
</head>

<body>
  <header>
    <h1>Curriculum Vitae</h1>
  </header>

  <section>
    <h3>Nombre</h3>
    <p>Elisabeth</p>

    <h3>Sobre mí</h3>
    <p>
      Soy una persona en formación que está aprendiendo desarrollo web
      y mejorando sus habilidades digitales.
    </p>
  </section>

  <section>
    <h2>Mis niveles</h2>

    <p>
      Nivel de conocimiento en HTML<br/>
      <progress value="60" max="100"></progress> 60%
    </p>

    <p>
      Conocimiento sobre Photoshop/Gimp<br/>
      <progress value="40" max="100"></progress> 40%
    </p>

    <p>
      Belleza<br/>
      <progress value="90" max="100"></progress> 90%
    </p>

    <p>
      Hambre<br/>
      <progress value="100" max="100"></progress> 100%
    </p>

    <p>
      Salud<br/>
      <progress value="80" max="100"></progress> 80%
    </p>
  </section>

</body>
</html>
