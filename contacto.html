<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comentarios</title>
<link rel="stylesheet" href="contacto.css">
</head>

<body>

<div id="Formulario de Contacto">
  <h3>Formulario de Contacto</h3>


  <form id="contenido" method="POST" >
    <input type="text" name="usuario" placeholder="Tu nombre de referencia/ e" required>
    <textarea name="comentario" placeholder="Razón de contacto..." required></textarea>
    <button type="submit">Enviar</button>
  </form>

    <h1>Ejemplo</h1>
    <div class="comentario">
        <strong>CiberSecurity, S.L.</strong>
        <p> Necesito información sobre sus servicios de ciberseguridad.</p>



  </div>
</div>

</body>
</html>
